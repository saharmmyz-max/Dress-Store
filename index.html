<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dress boutique - Mock API</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header class="header">
        <h1>Dress boutique</h1>
        <p>Learning GET and POST requests with Mock API</p>
    </header>

    <main class="main-container">
        <section class="form-section">
            <h2>Add New Dress</h2>

            <form id="dressForm">
                <input type="hidden" id="shirtId" />

                <div class="form-group">
                    <label for="name">Dress Name</label>

                    <input type="text" id="name" placeholder="Example: Black Oversized Dress" required />
                </div>

                <div class="form-group">
                    <label for="price">Price</label>

                    <input type="number" id="price" placeholder="Example: 25" required />
                </div>

                <div class="form-group">
                    <label for="image">Image URL</label>

                    <input type="text" id="image" placeholder="Paste image URL" required />
                </div>

                <div class="form-group">
                    <label for="color">Color</label>

                    <input type="text" id="color" placeholder="Example: Black" required />
                </div>

                <div class="form-group">
                    <label for="size">Size</label>

                    <select id="size" required>
                        <option value="">Choose size</option>
                        <option value="S">Small</option>
                        <option value="M">Medium</option>
                        <option value="L">Large</option>
                        <option value="XL">Extra Large</option>
                    </select>
                </div>

                <button type="submit" id="submitButton">Add Dress</button>
            </form>
        </section>

        <section class="products-section">
            <h2>Available Dresss</h2>

            <p id="loadingMessage">Loading Dresss...</p>

            <div id="dressContainer" class="dress-container"></div>
        </section>
    </main>
    s
    <script src="script.js"></script>
</body>

</html>
